# Catalog Service application configuration

server:
  port: 8080

spring:
  application:
    # Logical service name used by Eureka and API Gateway
    name: catalog-service

  rabbitmq:
    # RabbitMQ connection settings (must match other services)
    host: localhost
    port: 5672
    username: bookshelf
    password: senha123

  datasource:
    # PostgreSQL database configuration
    url: jdbc:postgresql://localhost:5432/libri-catalog
    username: user
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    # JPA and Hibernate configuration
    hibernate:
      ddl-auto: update  # Development mode
    show-sql: true     # Show SQL queries in logs

eureka:
  client:
    # Eureka Server location
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    # Instance identification and networking configuration
    hostname: localhost
    prefer-ip-address: false
    ip-address: 127.0.0.1
    non-secure-port-enabled: true
    secure-port-enabled: false
    instance-id: ${spring.application.name}:${server.port}

    # Additional metadata for Eureka dashboard
    metadata-map:
      instanceId: ${spring.application.name}:${server.port}
      hostname: localhost
      ip: 127.0.0.1
