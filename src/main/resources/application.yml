server:
  port: 8080

spring:
  application:
    name: catalog-service

  rabbitmq:
    host: localhost      # MESMA configuração do Bookshelf
    port: 5672
    username: bookshelf  # MESMO usuário
    password: senha123   # MESMA senha

  datasource:
    url: jdbc:postgresql://localhost:5432/libri-catalog
    username: user
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform=org:
      hibernate:
        dialect:
          PostgreSQLDialect:
    hibernate:
      ddl-auto: update  # Para desenvolvimento
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    # ⬇️ ESTA É A CONFIGURAÇÃO CRUCIAL ⬇️
    hostname: localhost                    # Força localhost
    prefer-ip-address: false               # ⬅️ FALSE para usar hostname
    ip-address: 127.0.0.1                  # Define IP explícito
    non-secure-port-enabled: true
    secure-port-enabled: false
    instance-id: ${spring.application.name}:${server.port}

    # Metadata adicional
    metadata-map:
      instanceId: ${spring.application.name}:${server.port}
      hostname: localhost
      ip: 127.0.0.1